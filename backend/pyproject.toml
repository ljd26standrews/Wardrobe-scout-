[project]
name = "wardrobe-scout-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["I", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
